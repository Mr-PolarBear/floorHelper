<div class="st-floor-nav-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>楼层导航与收起 (Floor Navigator)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div style="display: flex; flex-direction: column; gap: 12px; padding: 10px 4px;">
                <!-- 启用楼层收起 -->
                <label class="checkbox_label" for="st_floor_enable_collapse">
                    <input id="st_floor_enable_collapse" type="checkbox">
                    <span>启用超长楼层收起按钮</span>
                </label>

                <!-- 折叠高度阈值 -->
                <div>
                    <div class="flex-container justifySpaceBetween alignitemscenter">
                        <span title="当楼层正文高度超过此数值时，显示收起按钮并收起为此高度">收起触发高度阈值 (px):</span>
                        <span id="st_floor_collapse_height_value" class="opacity50p">300px</span>
                    </div>
                    <input id="st_floor_collapse_height" type="range" class="slider" min="150" max="800" step="25" value="300">
                </div>

                <!-- 自动收起超长楼层 -->
                <label class="checkbox_label" for="st_floor_auto_collapse">
                    <input id="st_floor_auto_collapse" type="checkbox">
                    <span title="当加载或生成超过阈值的长楼层时，自动将其收起">自动收起超过阈值的历史长楼层</span>
                </label>

                <!-- 从倒数第 N 楼开始自动收起（让最新楼保持展开） -->
                <div id="st_floor_auto_n_block" style="display: flex; align-items: center; justify-content: space-between; padding-left: 24px; transition: opacity 0.2s ease;">
                    <span title="默认保留最新的楼层完整展开。例如设为 2 时，最新的第1条消息展开，从倒数第2条及更早的历史超长楼层自动收起">
                        从倒数第几楼开始自动收起 (N):
                    </span>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <input id="st_floor_auto_n" type="number" class="text_pole" min="1" max="20" step="1" value="2" style="width: 55px; text-align: center; padding: 2px 4px;">
                        <span class="opacity50p" style="font-size: 12px;">楼</span>
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 4px 0;">

                <!-- 启用右侧悬浮跳转按钮 -->
                <label class="checkbox_label" for="st_floor_enable_jump">
                    <input id="st_floor_enable_jump" type="checkbox">
                    <span>在输入区上方显示悬浮楼层跳转按钮</span>
                </label>

                <!-- 缩略预览字数 -->
                <div>
                    <div class="flex-container justifySpaceBetween alignitemscenter">
                        <span title="楼层跳转列表中每条楼层预览展示的纯文字数">楼层列表预览字数:</span>
                        <span id="st_floor_preview_len_value" class="opacity50p">20字</span>
                    </div>
                    <input id="st_floor_preview_len" type="range" class="slider" min="10" max="60" step="5" value="20">
                </div>

                <div class="hint opacity70p" style="font-size: 11px; line-height: 1.4;">
                    <i class="fa-solid fa-circle-info"></i>
                    提示：N=2 时，当 AI 回复不再是最后一楼（用户发了新消息或有了更新的回复），该历史超长楼层就会自动收起，始终保持最新楼层展开阅读。
                </div>
            </div>
        </div>
    </div>
</div>
